name: CramAI CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, lam]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cramai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    env:
      MODEL_PROVIDER: fake
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Show benchmark, metrics and team diagnostics
        run: python run.py check
      - name: Verify evaluation runner offline
        run: python run.py eval --fake

  scope:
    name: Role scope
    if: github.event_name == 'pull_request' && (github.head_ref == 'lam' || startsWith(github.head_ref, 'cramai/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_BRANCH: ${{ github.head_ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check role ownership
        shell: bash
        run: |
          case "$PR_BRANCH" in
            lam|cramai/lam-integration|cramai/lam-oracle-vps|cramai/lam-package-fix) role=lam ;;
            cramai/hung-workflow) role=hung ;;
            cramai/khiem-data) role=khiem ;;
            cramai/phuoc-anh-product) role=phuoc-anh ;;
            *) echo "Unknown CramAI role branch. See docs/agents.md." >&2; exit 1 ;;
          esac
          python3 scripts/check_agent_scope.py --role "$role" --base "$PR_BASE_SHA"

  web:
    # Feature 003 (T011): contract tests, built frontend in sync with its source,
    # a smoke run of the API and pages, and the Docker image built from this commit.
    name: Web (contract, smoke, image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL_PROVIDER: fake
      PYTHONUTF8: '1'
      CRAMAI_ADMIN_USER: ci-admin
      CRAMAI_ADMIN_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install project and backend dependencies
        run: python -m pip install -r requirements.txt -r backend/requirements-dev.txt
      - name: Backend unit tests
        run: python -m unittest discover -s backend -p "test_*.py" -v
      - name: Web exam tests against the OpenAPI contract
        run: python -m unittest tests.test_web_exams -v
      - name: Smoke the API and pages with Uvicorn
        shell: bash
        run: |
          CRAMAI_WEB_DB="$RUNNER_TEMP/smoke.db" PYTHONPATH=backend:codebase \
            python -m uvicorn app:app --app-dir backend --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          python scripts/web_smoke.py http://127.0.0.1:8000 || { cat "$RUNNER_TEMP/uvicorn.log"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Built frontend matches its source
        shell: bash
        run: |
          npm ci --prefix frontend/web --no-audit --no-fund
          npm run build --prefix frontend/web
          if [[ -n "$(git status --porcelain -- frontend/student frontend/admin)" ]]; then
            git status --short -- frontend/student frontend/admin
            echo "frontend/student or frontend/admin is out of date. Run 'npm run build' in frontend/web and commit the output." >&2
            exit 1
          fi
      - name: Build the Docker image for this commit and smoke it
        shell: bash
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "cramai-web:$GITHUB_SHA" .
          docker run -d --name cramai -p 8001:8000 \
            -e CRAMAI_ADMIN_USER -e CRAMAI_ADMIN_PASSWORD -e MODEL_PROVIDER "cramai-web:$GITHUB_SHA"
          python scripts/web_smoke.py http://127.0.0.1:8001 || { docker logs cramai; exit 1; }
          docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "cramai-web:$GITHUB_SHA"

  package:
    name: Package repository snapshot
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ZIP and checksum
        shell: bash
        run: |
          ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [[ -n "$ignored" ]]; then
            echo "A tracked file matches the repository's ignore rules. Review before packaging." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cramai-artifact"
          git archive --format=zip --prefix=CramAI/ --output="$RUNNER_TEMP/cramai-artifact/cramai.zip" HEAD
          cd "$RUNNER_TEMP/cramai-artifact"
          unzip -tq cramai.zip
          sha256sum cramai.zip > cramai.zip.sha256
      - name: Upload snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cramai-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cramai-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  deploy-oracle:
    name: Deploy to Oracle VPS
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.ORACLE_VPS_DEPLOY_ENABLED == 'true'
    needs: [test, web]
    environment: oracle-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: oracle-production-deploy
      cancel-in-progress: false
    steps:
      - name: Validate deployment secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ORACLE_HOST ORACLE_SSH_USER ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS ORACLE_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required environment secret: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$ORACLE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "ORACLE_HOST must be an IPv4 address or DNS hostname." >&2
            exit 1
          fi
          if [[ ! "$ORACLE_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "ORACLE_SSH_USER has an invalid format." >&2
            exit 1
          fi
          if [[ ! "$ORACLE_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ || "$ORACLE_DEPLOY_PATH" == *..* ]]; then
            echo "ORACLE_DEPLOY_PATH must be an absolute dedicated path without parent-directory segments." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected commit SHA format." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$HOME/.ssh/oracle_vps"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/oracle_vps" "$HOME/.ssh/known_hosts"

      - name: Deploy the tested main commit
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          remote_command="cd '$ORACLE_DEPLOY_PATH' && git fetch --prune origin main && git switch main && git reset --hard '$GITHUB_SHA' && docker compose --env-file deploy/oracle/.env.oracle -f deploy/oracle/compose.yml pull caddy && docker compose --env-file deploy/oracle/.env.oracle -f deploy/oracle/compose.yml up -d --build --remove-orphans"
          ssh -i "$HOME/.ssh/oracle_vps" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$ORACLE_SSH_USER@$ORACLE_HOST" "$remote_command"
