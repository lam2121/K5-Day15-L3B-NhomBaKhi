# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# Người phụ trách: Bùi Phước Anh (cùng Khiêm). Review và chấm thử độc lập: Nguyễn Duy Hưng.
# Đơn vị chấm: mỗi câu thử là một dòng trong eval/run-N.csv. Người chấm đọc cột output
# và trace của đúng câu đó trong traces/run-N.jsonl (danh sách đoạn search_slides trả về).
# Mỗi câu hỏi trong output là một khối bắt đầu bằng mã qNN, có dòng `Đáp án:` và dòng `Nguồn:`
# dạng `tên-file.pdf, trang N [mã-đoạn]` (do make_response trong codebase/contracts.py sinh ra).
# Mã đoạn bắt đầu bằng tiền tố ngày dayNN (vd day03-...), dùng để biết câu hỏi lấy từ ngày nào.
# Output không có khối qNN nào = phản hồi không ra đề (hỏi lại, thiếu căn cứ, ngoài phạm vi).
# Hai kiểu yêu cầu: ôn theo chủ đề (một khái niệm / một buổi) và ôn tổng hợp (nhiều ngày).
# Mọi câu hỏi đều là trắc nghiệm: đề bài có đủ bốn phương án A, B, C, D, dòng Đáp án ghi một chữ cái.
# Không sinh câu tự luận (quyết định 27/11, trước CP2).
# Nhãn độ khó (Dễ / Vừa / Khó) vẫn có trong output theo hợp đồng v1 nhưng KHÔNG được chấm:
# nhóm tạm bỏ qua độ khó trong lát cắt này (quyết định 27/11, trước CP2).

metrics:
  - name: "trich_dan_hop_le"
    definition: "Với output có ra đề: mọi khối qNN có ít nhất một nguồn, và mỗi mã đoạn trong dòng Nguồn đều nằm trong danh sách đoạn search_slides trả về ở trace của chính câu thử đó, với tên file và số trang trùng khớp bản ghi đoạn. Chỉ cần một mã sai là câu thử không đạt metric này."
    grader: "code"
    threshold: "100% câu thử có ra đề"
    why: "Học viên dùng số trang để mở lại slide kiểm chứng và sửa câu sai trước kỳ thi; trích sai trang làm mất đúng khả năng kiểm chứng đó (pain: tốn giờ đọc lại slide, canvas.md dòng 3 và 6)."
  - name: "dap_an_co_can_cu"
    definition: "Người chấm đọc nội dung đoạn được trích (lấy text từ trace) cho từng khối qNN. Khối đạt khi đáp án đúng và mọi ý chính của đáp án đều đọc ra được từ đoạn trích, không thêm kiến thức ngoài đoạn. Khối phải là câu trắc nghiệm có đủ bốn phương án A, B, C, D và đúng một phương án đúng theo đoạn trích; khối tự luận hoặc thiếu phương án tính là không đạt. Slide chỉ ghi gạch đầu dòng gợi ý giảng mà không có nội dung trả lời thì không được dùng làm căn cứ cho đáp án. Tỉ lệ = số khối đạt / tổng số khối qNN trên các câu thử thuong và kho có ra đề."
    grader: "nguoi"
    threshold: "≥ 90% khối câu hỏi"
    why: "Nhiều slide chỉ là dàn ý cho giảng viên, nên model dễ tự điền kiến thức ngoài slide; đáp án bịa hoặc lệch slide khiến học viên học sai và mất điểm thi thật (canvas.md dòng 6)."
  - name: "khong_ra_de_khi_thieu_can_cu"
    definition: "Với câu thử tu_choi và câu thử kho có expected là hỏi lại, thiếu căn cứ hoặc ngoài phạm vi: output không chứa khối qNN nào, và output nêu bước tiếp theo cho học viên theo dấu hiệu kiểm được bằng code: có câu hỏi lại kết thúc bằng dấu '?' hoặc chứa ít nhất một trong các từ 'chọn', 'nêu', 'ví dụ' (không phân biệt hoa thường) (vd chọn chủ đề có trong bộ slide, nêu rõ ngày hoặc file muốn ôn). Output vừa từ chối vừa ra câu hỏi tính là không đạt."
    grader: "code"
    threshold: "100% câu tu_choi · ≥ 80% câu kho thuộc loại này"
    why: "Khi chủ đề không có trong slide, một đề trông hợp lý nhưng không có căn cứ còn hại hơn không có đề: học viên tin là trọng tâm và ôn lệch (G10, canvas.md dòng 6)."
  - name: "phu_nhieu_ngay"
    definition: "Với câu thử ôn tổng hợp (input yêu cầu ôn nhiều ngày hoặc cả khoá) có ra đề: đếm số ngày khác nhau theo tiền tố dayNN của mã đoạn trong dòng Nguồn. Gọi D = số ngày khác nhau trong phạm vi yêu cầu (cả khoá, hoặc khoảng ngày input chỉ định) có ít nhất một đoạn không phải dàn ý trong data/passages.jsonl. Nếu D ≥ 4: đạt khi đề có câu từ ít nhất 4 ngày khác nhau và không ngày nào chiếm quá 1/3 số khối qNN. Nếu D < 4: đạt khi đề có câu từ đủ D ngày đó. Nếu input chỉ định một khoảng ngày thì mọi mã đoạn phải thuộc khoảng đó."
    grader: "code"
    threshold: "≥ 80% câu thử ôn tổng hợp có ra đề"
    why: "Kiến thức thi giữa kỳ trải 14 ngày với nhiều bộ slide mỗi ngày; đề dồn vào một vài ngày khiến học viên tưởng đã ôn đủ mà vẫn hổng phần còn lại (canvas.md dòng 3)."
