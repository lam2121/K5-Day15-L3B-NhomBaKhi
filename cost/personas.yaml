# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Mọi dòng mẫu của khung đã được thay bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 300
  base: 470
  high: 700
  source: "Nhóm L3 hơn 700 học viên, lấy mốc gần đúng 700 (đề hackathon Track A: https://github.com/VinUni-AI20k/K5-L3-Day15-AI-Product-Hackathon/blob/main/tracks/track-a-edtech.md#L73). Khảo sát 27/11 (evidence/survey/results.csv): 14/21 (67%) từng mở lại slide để ôn → cơ sở = 700 × 14/21 ≈ 470. Cao = toàn bộ 700 (tự ước tính: mọi học viên dùng trước kỳ thi). Thấp = 300 (tự ước tính)."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
                    # Nguồn chung: khảo sát 27/11, câu 3 "Trong 7 ngày qua mở lại slide để ôn mấy lần", 14 người từng ôn bằng slide.
  - name: on_it
    share: 0.14             # 2/14 người: 0 lần trong 7 ngày qua
    uses_per_month: 2       # (tự ước tính) ôn dồn trước kỳ thi
    turns_per_session: 1    # (tự ước tính)
    source: "Khảo sát 27/11 câu 3: 2/14 trả lời 0 lần/7 ngày. Số lần/tháng và số lượt/phiên: (tự ước tính)."
  - name: on_moi_tuan
    share: 0.50             # 7/14 người: 1 lần trong 7 ngày qua
    uses_per_month: 4       # 1 lần/tuần × ~4 tuần
    turns_per_session: 2    # (tự ước tính) câu 4: 8/14 ôn 1 ngày học mỗi lần → 1–2 yêu cầu
    source: "Khảo sát 27/11 câu 3: 7/14 trả lời 1 lần/7 ngày → ~4 lần/tháng. Số lượt/phiên: (tự ước tính) từ câu 4."
  - name: on_thuong_xuyen
    share: 0.36             # 5/14 người: 2 lần trong 7 ngày qua
    uses_per_month: 8       # 2 lần/tuần × ~4 tuần
    turns_per_session: 3    # (tự ước tính) câu 4: 5/14 ôn 2–3 ngày học mỗi lần → nhiều yêu cầu
    source: "Khảo sát 27/11 câu 3: 5/14 trả lời 2 lần/7 ngày → ~8 lần/tháng. Số lượt/phiên: (tự ước tính) từ câu 4."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token, giá trả phí chuẩn (không batch, không cache) từ trang giá chính thức. ≥2 mức model
                    # Tên model phải trùng mã model ghi trong lượt đo (T012) thì simulate mới tính "thực đo".
  - model: claude-haiku-5-5
    input: 0.10
    output: 0.50
    source: "https://platform.claude.com/docs/en/about-claude/pricing · xem 27/11/2026 · mức prompt ≤100.000 token (prompt dài hơn: 0,50 / 2,50)"
  - model: claude-sonnet-5-5
    input: 2.00
    output: 10.00
    source: "https://platform.claude.com/docs/en/about-claude/pricing · xem 27/11/2026"
  - model: gemini-3.8-flash
    input: 0.75
    output: 3.75
    source: "https://aistudio.google.com/docs/pricing (chuyển từ ai.google.dev/gemini-api/docs/pricing) · xem 27/11/2026 · Paid Tier, giá đến 31/12/2026; từ 01/01/2027 là 1,50 / 7,50"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
